title: How to Become an IAM Architect
description: >-
  A concept-first, vendor-neutral roadmap to becoming an Identity & Access
  Management architect. Principles, protocols, patterns and business thinking —
  with SailPoint, One Identity, Ping and the rest mapped in as illustrations,
  not as the syllabus.

remote_theme: just-the-docs/just-the-docs

url: https://arafatomer66.github.io
baseurl: /iam-architect-roadmap

# ---------------------------------------------------------------------------
# Theme behaviour
# ---------------------------------------------------------------------------
color_scheme: dark
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

# Mermaid diagrams (also render natively when browsing the repo on GitHub)
mermaid:
  version: "10.9.1"

# ---------------------------------------------------------------------------
# Chrome
# ---------------------------------------------------------------------------
aux_links:
  "GitHub repo":
    - "https://github.com/arafatomer66/iam-architect-roadmap"
aux_links_new_tab: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Concept-first IAM architecture roadmap. Tools change, principles don't.
  Licensed under CC BY 4.0.

last_edit_timestamp: false
gh_edit_link: false

# ---------------------------------------------------------------------------
# Callouts
# ---------------------------------------------------------------------------
callouts_level: quiet
callouts:
  note:
    title: Note
    color: blue
  concept:
    title: Core concept
    color: purple
  architect:
    title: Architect's lens
    color: green
  warning:
    title: Watch out
    color: red
  vendor:
    title: In the products
    color: yellow

# ---------------------------------------------------------------------------
# Jekyll
# ---------------------------------------------------------------------------
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

relative_links:
  enabled: true
  collections: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - CONTRIBUTING.md
  - CLAUDE.md

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false
